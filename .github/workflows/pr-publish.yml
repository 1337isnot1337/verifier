name: Publish submission PR result
on:
  workflow_run:
    workflows: [Verify submission PR]
    types: [completed]
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
concurrency:
  group: bos-pr-publisher-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out only the trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate artifact, run identity, complete diff, and immutable head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/pr_submissions.py publish_pr
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-submission-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: published/pr-submission.json
          if-no-files-found: error
          retention-days: 90
